; Aether Server: Gitea application configuration (starting point).
;
; Runs as the gitea account with repositories under /var/lib/gitea. Complete
; first-run setup in the browser. For a small team the built-in SQLite database
; is sufficient; change DB settings here or during setup if you attach
; PostgreSQL from the database role.

APP_NAME = Aether Server
RUN_USER = gitea
RUN_MODE = prod

[database]
DB_TYPE  = sqlite3
PATH     = /var/lib/gitea/data/gitea.db

[server]
PROTOCOL         = http
DOMAIN           = git.example.lan
HTTP_PORT        = 3000
ROOT_URL         = http://git.example.lan:3000/
DISABLE_SSH      = false
SSH_PORT         = 22
LFS_START_SERVER = true
LFS_JWT_SECRET   = REPLACE_WITH_RANDOM_SECRET

[repository]
ROOT = /var/lib/gitea/repositories

[security]
INSTALL_LOCK      = false
SECRET_KEY        = REPLACE_WITH_RANDOM_SECRET
DISABLE_GIT_HOOKS = false
