; Aether Server: Asterisk PJSIP endpoint example.
;
; Registers one SIP endpoint. Replace the passwords and addresses, then reload
; with "asterisk -rx 'module reload res_pjsip'". RTP media uses a UDP port
; range (default 10000-20000) that must be opened separately from SIP 5060 for
; calls to carry audio.

[global]
type = global
endpoint_identifier_order = ip,username

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[6001]
type = endpoint
context = internal
disallow = all
allow = ulaw, alaw
auth = auth6001
aors = 6001
direct_media = no

[auth6001]
type = auth
auth_type = userpass
username = 6001
password = REPLACE_WITH_SIP_PASSWORD

[6001]
type = aor
max_contacts = 1

[internal]
type = context
