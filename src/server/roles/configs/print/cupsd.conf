# Aether Server: CUPS print server (starting point).
#
# Shares queues with the local subnet and exposes the web interface on
# loopback only. Add printers with lpadmin or through the web interface at
# http://localhost:631. A stronger configuration restricts sharing to a
# specific subnet rather than the whole RFC 1918 space.

LogLevel warn
MaxLogSize 0

# Listen for print clients, and for the local web interface.
Listen 631
Listen localhost:631

# Web interface is local-only by default; change to @LOCAL to allow the LAN.
<Location />
  Order allow,deny
  Allow localhost
</Location>
<Location /admin>
  Order allow,deny
  Allow localhost
</Location>
<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow localhost
</Location>

# Share queues with the local network.
<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default
  <Limit All>
    Order deny,allow
  </Limit>
</Policy>

Browsing Off
