# Aether Server: Prometheus scrape configuration.
#
# Scrapes the local node exporter and itself. Add targets under
# scrape_configs for the other machines and services you want to observe.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    site: aether-server

rule_files:
  # - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [ "127.0.0.1:9090" ]

  - job_name: node
    static_configs:
      - targets: [ "127.0.0.1:9100" ]

  # Example: a second host running node_exporter.
  # - job_name: servers
  #   static_configs:
  #     - targets: [ "10.0.0.20:9100", "10.0.0.21:9100" ]
