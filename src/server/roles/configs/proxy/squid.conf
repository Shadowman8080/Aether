# Aether Server: Squid forward proxy with a local-network ACL.
#
# Only the local subnet may use the proxy, and the cache keeps disk use in
# check. Add "acl" lines and matching http_access rules to allow other networks
# or to filter destinations.

http_port 3128

# Define the clients allowed to use the proxy.
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16

acl SSL_ports  port 443
acl Safe_ports port 80 21 443 563 70 210 1025-65535
acl CONNECT     method CONNECT

# Deny unsafe ports before allowing the local network.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localnet
http_access deny all

# Cache settings.
cache_dir ufs /var/spool/squid 4096 16 256
cache_mem 128 MB
coredump_dir /var/spool/squid
