# Aether Server: Samba file share example.
#
# One authenticated share is defined under /srv/aether. Create the share
# directory, a matching group, and a Samba password before clients can connect:
#
#   mkdir -p /srv/aether && chgrp aethershare /srv/aether && chmod 2770 /srv/aether
#   smbpasswd -a <user>

[global]
    workgroup = WORKGROUP
    server string = Aether Server
    server role = standalone server
    security = user
    map to guest = never
    disable netbios = yes

    # Modern SMB dialects only.
    server min protocol = SMB3

[share]
    comment = Aether shared files
    path = /srv/aether
    browseable = yes
    read only = no
    valid users = @aethershare
    create mask = 0660
    directory mask = 2770
