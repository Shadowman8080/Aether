# Aether Server: Dovecot IMAP/POP3 and LMTP (starting point).
#
# Provides the authenticated mailbox side of the mail server and the SASL
# socket Postfix uses. Certificates come from ssl_cert / ssl_key, which point
# at the certificate-authority role or a public certificate.

protocols = imap lmtp

mail_location = maildir:/var/mail/%u/Maildir

ssl = required
ssl_cert = </etc/ssl/certs/mail.crt
ssl_key = </etc/ssl/private/mail.key

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

passdb {
  driver = pam
}
userdb {
  driver = passwd
}

# Do not let one mailbox exhaust the server.
service imap-login {
  process_min_avail = 1
}
