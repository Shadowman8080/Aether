# Aether Server: GitLab Runner configuration (unregistered starting point).
#
# Register the runner with "gitlab-runner register". A shell executor gives a
# job the full access of the account the runner uses, so prefer the Docker
# executor where the container host role is present, and mark untrusted
# projects non-privileged.

concurrent = 4
check_interval = 3
log_level = "info"

[session_server]
  session_timeout = 1800

