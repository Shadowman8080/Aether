name: Aether source and desktop checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regressions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: settings
            source: src/controlcenter
          - name: installer
            source: src/desktop/installer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ qt6-base-dev qt6-svg-dev
      - name: Compile desktop component
        run: |
          cmake -S "${{ matrix.source }}" -B build-ci/${{ matrix.name }} -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ci/${{ matrix.name }} --parallel "$(nproc)"
      - name: Exercise Settings pages without running administrator actions
        if: matrix.name == 'settings'
        run: QT_QPA_PLATFORM=offscreen build-ci/settings/aether-settings --capture-dir test-results/desktop/settings
      - name: Preserve Settings page captures
        if: always() && matrix.name == 'settings'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: settings-build-captures
          path: test-results/desktop/
          if-no-files-found: ignore
          retention-days: 14
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install test-only dependencies
        run: |
          python -m pip install -r src/updates/requirements.txt
          command -v gpg
          command -v gpgv
      - name: Verify package signatures and TUF metadata
        run: python src/updates/verify.py --output test-results/updates
      - name: Verify privacy, preferences and recovery validation
        run: python src/controlcenter/test_features.py
      - name: Verify offline inventory boundaries
        run: python src/updates/test_inventory.py
      - name: Verify network trust boundaries
        run: python src/security/test_network_profiles.py
      - name: Verify diagnostic privacy boundaries
        run: python src/controlcenter/test_diagnostics.py
      - name: Verify first-boot service policy
        run: python src/security/test_presets.py
      - name: Verify USB policy trial recovery
        run: python src/security/test_usb_trial.py
      - name: Verify live Home to Public firewall transition
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nftables iproute2 restic
          sudo python3 build/next-20261007/test-network-live.py src/security/aether-firewall
      - name: Verify backup restore and corruption detection
        run: python build/next-20261007/test-backup-roundtrip.py --restic /usr/bin/restic --output test-results/backups
      - name: Verify generated sound assets
        run: python src/sounds/test_sounds.py
      - name: Preserve non-secret verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-verification
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
