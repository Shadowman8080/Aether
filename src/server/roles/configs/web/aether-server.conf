# Aether Server: Nginx site for the default vhost.
#
# Serves /srv/www over HTTP. Add a TLS server block once a certificate exists
# (from the certificate-authority role or a public CA) and redirect :80 to it.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/www;
    index index.html;

    # Keep server details out of responses and errors.
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    # If the application-server role is present, proxy PHP to its socket.
    # location ~ \.php$ {
    #     include        fastcgi_params;
    #     fastcgi_pass   unix:/run/php-fpm/aether.sock;
    #     fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    # }
}
