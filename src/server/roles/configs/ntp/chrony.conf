# Aether Server: chrony NTP server and client.
#
# Serves time to the local subnet while synchronising the host to upstream
# sources. Replace the public pool with your regional pool or an internal
# reference if the server has no internet access.

# Record the rate at which the system clock gains or loses time.
driftfile /var/lib/chrony/drift

# Correct the clock in small steps and step it only if it is very wrong.
makestep 1.0 3
rtcsync

# Upstream sources.
pool 2.pool.ntp.org iburst

# Serve time to the local network. Narrow this to the addresses you actually
# want to serve rather than the whole RFC 1918 space.
allow 10.0.0.0/8
allow 172.16.0.0/12
allow 192.168.0.0/16
allow 2001:db8::/32

# Log clock changes rather than every measurement.
logdir /var/log/chrony
log measurements statistics tracking
