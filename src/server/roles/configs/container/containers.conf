# Aether Server: Podman container host configuration (starting point).
#
# Rootless Podman needs no daemon and is the default. The API socket is enabled
# by the role so tooling can talk to it. Published container ports are opened
# per container rather than host-wide.

[containers]
default_capabilities = [
  "CHOWN", "DAC_OVERRIDE", "FOWNER", "FSETID", "KILL", "NET_BIND_SERVICE",
  "SETFCAP", "SETGID", "SETPCAP", "SETUID", "SYS_CHROOT"
]
# Drop the default set of capabilities rather than adding to it.
default_sysctls = []
log_driver = "journald"

[network]
# Do not create a default bridge that bypasses host firewalling.
default_subnet = "10.88.0.0/16"

[engine]
# The events and service logs go to the journal like the rest of Aether.
events_logger = "journald"
