# Aether Server: HAProxy reverse proxy / load balancer example.
#
# Fronts an HTTP backend and adds health checking and standard forwarding
# headers. Add TLS by binding :443 with a crt and combining it with the
# certificate-authority role or a public certificate.

global
    log /dev/log local0
    maxconn 4096
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_in
    bind *:80
    default_backend app_pool

backend app_pool
    balance roundrobin
    option httpchk GET /health
    server app1 127.0.0.1:8080 check

# Statistics on loopback only; open deliberately if you need remote polling.
listen stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /stats
    stats refresh 10s
