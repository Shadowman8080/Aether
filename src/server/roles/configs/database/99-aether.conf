# Aether Server: PostgreSQL tuning and listeners.
#
# Included from the main postgresql.conf as a drop-in. Values are conservative
# for a small server; raise shared_buffers and work_mem with the machine's RAM.
# Open the listener only when the database must be reached over the network.

# Loopback only by default. Add the server's address or '*' to serve the network
# (and add a matching host line to pg_hba.conf).
listen_addresses = 'localhost'
port = 5432

# Connection limits and modest memory settings for a small server.
max_connections = 100
shared_buffers = 256MB
work_mem = 8MB
maintenance_work_mem = 64MB
effective_cache_size = 768MB

# Log slow queries so they can be found later.
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '
