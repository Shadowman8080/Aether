; Aether Server: PHP-FPM pool for the application server role.
;
; The pool listens on a Unix socket and is never exposed on the network. The
; web server proxies matching requests to SOCKET_PATH (/run/php-fpm/aether.sock).
; Create the runtime and session directories owned by the pool user.

[aether]
user = php-fpm
group = php-fpm

listen = /run/php-fpm/aether.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = ondemand
pm.max_children = 20
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Never reveal PHP version or errors to the network.
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_value[error_log] = /var/log/php-fpm/aether-error.log

; Restrict the file paths a script may open.
php_admin_value[open_basedir] = /srv/www:/tmp

; Session files live in a dedicated directory.
php_value[session.save_path] = /var/lib/php/session
