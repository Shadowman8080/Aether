# Aether Server: FreeRADIUS clients (NAS) example.
#
# Each entry is a device or concentrator allowed to ask this server for
# authentication decisions: a switch, wireless controller, VPN gateway or
# firewall. The shared secret must be changed and must match the device.

client localhost {
    ipaddr = 127.0.0.1
    secret = change-me-loopback
    shortname = localhost
    nastype = other
}

client access-switch {
    ipaddr = 10.0.0.2
    secret = change-me-switch
    shortname = access-switch
}
