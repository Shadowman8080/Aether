// Aether Server: Kea DHCPv4 example configuration.
//
// Subnet, pool and options below are placeholders. Query the interface that
// faces the clients, then validate before starting:
//
//   kea-dhcp4 -t /etc/kea/kea-dhcp4.conf
//
// The lease database is kept in memory only; enable the lease file below for a
// restart-safe database.

{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "eth0" ]
    },

    "leases": [ ],

    "subnet4": [
      {
        "id": 1,
        "subnet": "10.0.0.0/24",
        "pools": [
          { "pool": "10.0.0.100 - 10.0.0.200" }
        ],
        "option-data": [
          { "name": "routers", "data": "10.0.0.1" },
          { "name": "domain-name-servers", "data": "10.0.0.1, 1.1.1.1" },
          { "name": "domain-name", "data": "lan" }
        ],
        "valid-lifetime": 3600,
        "max-valid-lifetime": 7200
      }
    ],

    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [ { "output": "/var/log/kea-dhcp4.log" } ],
        "severity": "INFO"
      }
    ]
  }
}
