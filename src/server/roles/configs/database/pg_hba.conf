# Aether Server: PostgreSQL client authentication.
#
# Local socket logins use peer authentication; TCP is refused for every host
# until you add an explicit rule. Open the network deliberately by adding a
# line such as:
#
#   host    all   appuser   10.0.0.0/24   scram-sha-256
#
# "local" lines apply to Unix sockets, "host" lines to TCP/IP.

# TYPE      DATABASE   USER       ADDRESS       METHOD
local       all        all                      peer
host        all        all        127.0.0.1/32  scram-sha-256
host        all        all        ::1/128       scram-sha-256

# Reject everything else instead of falling through to a permissive rule.
host        all        all        all           reject
