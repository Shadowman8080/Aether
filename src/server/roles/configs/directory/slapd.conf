# Aether Server: minimal OpenLDAP (slapd) configuration.
#
# Set the base DN and root credentials before starting slapd, then load a
# schema and your initial entries with ldapadd. Mode stays 0640 because the
# rootpw line can carry a hash.

include         /etc/openldap/schema/core.schema
include         /etc/openldap/schema/cosine.schema
include         /etc/openldap/schema/inetorgperson.schema
include         /etc/openldap/schema/nis.schema

pidfile         /run/openldap/slapd.pid
argsfile        /run/openldap/slapd.args

# Base distinguished name for the directory. Change to match your naming.
database        mdb
maxsize         1073741824
suffix          "dc=lan"
rootdn          "cn=admin,dc=lan"
# Replace before use: prefer the slappasswd hash over a plaintext secret.
rootpw          {SSHA}REPLACE_WITH_slappasswd_OUTPUT
directory       /var/lib/openldap/openldap-data

index   objectClass     eq
index   uid,cn,mail     eq,pres
