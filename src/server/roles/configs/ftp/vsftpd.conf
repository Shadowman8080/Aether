# Aether Server: vsftpd example configuration.
#
# Local authentication with a chroot per user. Transport is plain FTP unless
# TLS is enabled below; prefer SFTP from the OpenSSH role where possible.

listen=YES
listen_ipv6=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# Keep each user inside their home directory.
chroot_local_user=YES
allow_writeable_chroot=YES

# Passive mode port range; open this range in the firewall for passive clients.
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100

# Enable TLS by pointing these at a certificate and uncommenting.
# rsa_cert_file=/etc/ssl/certs/ftp.crt
# rsa_private_key_file=/etc/ssl/private/ftp.key
# ssl_enable=YES
