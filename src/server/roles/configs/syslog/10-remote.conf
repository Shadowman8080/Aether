# Aether Server: receive rsyslog events from remote hosts.
#
# Listens on TCP and UDP 514, writes per-host logs under /var/log/remote, and
# stops a remote host from filling the disk with a single repetitive message.
# The standard /etc/rsyslog.conf stacks this include on top of the local rules.

module(load="imudp")
input(type="imudp" port="514")

module(load="imtcp")
input(type="imtcp" port="514")

# One file per remote address; the hostname is kept inside the message.
template(name="AetherRemotePerHost" type="string"
         string="/var/log/remote/%FROMHOST-IP%/%$YEAR%-%$MONTH%-%$DAY%.log")

# Drop a remote host that floods us with duplicate lines.
$RepeatedMsgReduction on

ruleset(name="aether-remote") {
    action(type="omfile" dynaFile="AetherRemotePerHost"
           fileOwner="root" fileGroup="adm" fileCreateMode="0640")
}

input(type="imudp" port="514" ruleset="aether-remote")
input(type="imtcp" port="514" ruleset="aether-remote")
