# Aether Server: OpenSSH hardening drop-in.
# Included automatically by the system sshd_config (Include
# /etc/ssh/sshd_config.d/*.conf). Values here override the defaults above.
#
# PasswordAuthentication stays on so a fresh install can be reached with the
# administrator password. Install an SSH key, confirm key login works, then set
# PasswordAuthentication to no and reload the service:
#
#   ssh-copy-id you@server
#   sed -i 's/^PasswordAuthentication yes/PasswordAuthentication no/' \
#       /etc/ssh/sshd_config.d/50-aether.conf
#   systemctl reload sshd

PermitRootLogin no
PasswordAuthentication yes
PubkeyAuthentication yes
KbdInteractiveAuthentication no

# Restrict which users may open a shell. Add domain or service accounts as needed.
AllowGroups wheel

# Keep the occasional dropped mobile session from hanging.
ClientAliveInterval 120
ClientAliveCountMax 3

# Do not expose the GSSAPI path until the machine is joined to a domain.
GSSAPIAuthentication no
GSSAPICleanupCredentials yes
