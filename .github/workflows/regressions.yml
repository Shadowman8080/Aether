name: Aether source regressions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regressions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install test-only dependencies
        run: |
          python -m pip install -r src/updates/requirements.txt
          command -v gpg
          command -v gpgv
      - name: Verify package signatures and TUF metadata
        run: python src/updates/verify.py --output test-results/updates
      - name: Verify privacy, preferences and recovery validation
        run: python src/controlcenter/test_features.py
      - name: Verify offline inventory boundaries
        run: python src/updates/test_inventory.py
      - name: Verify network trust boundaries
        run: python src/security/test_network_profiles.py
      - name: Verify diagnostic privacy boundaries
        run: python src/controlcenter/test_diagnostics.py
      - name: Verify first-boot service policy
        run: python src/security/test_presets.py
      - name: Verify live Home to Public firewall transition
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nftables iproute2
          sudo python3 build/next-20261007/test-network-live.py src/security/aether-firewall
      - name: Verify generated sound assets
        run: python src/sounds/test_sounds.py
      - name: Preserve non-secret verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-verification
          path: test-results/updates/
          if-no-files-found: ignore
          retention-days: 14
