# Aether Server: libvirt daemon configuration (starting point).
#
# Enables the TLS-capable and TCP listeners only on loopback by default, and
# sets sane connection limits. Remote administration should go over TLS or
# through SSH, not the unauthenticated TCP socket.

listen_tls = 1
listen_tcp = 0

# Loopback-only listeners; do not expose libvirt to the network directly.
listen_addr = "127.0.0.1"

# Used only if the TCP listener is switched on above.
# auth_tcp = "sasl"

# Allow the qemu:///system connection to be used by an administrative group.
unix_sock_group = "libvirt"
unix_sock_ro_perms = "0777"
unix_sock_rw_perms = "0770"

log_level = 3
log_outputs = "3:file:/var/log/libvirt/libvirtd.log"

max_clients = 64
