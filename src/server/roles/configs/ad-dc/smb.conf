# Aether Server: Samba configured as an Active Directory domain controller.
#
# This file is a STARTING POINT, not a provisioned domain. Create the domain
# once with, for example:
#
#   samba-tool domain provision --realm=EXAMPLE.LAN --domain=EXAMPLE \
#       --adminpass='<strong-password>' --dns-backend=SAMBA_INTERNAL --use-rfc2307
#
# A domain is irreversible to un-create, needs a static address and correct
# DNS, and should not share a machine with the plain file-server role.

[global]
    server role = active directory domain controller
    dns forwarder = 1.1.1.1
    workgroup = EXAMPLE
    realm = EXAMPLE.LAN
    netbios name = AETHER-DC
    server services = s3fs, rpc, nbt, wrepl, ldap, cldap, kdc, drepl, winbindd, ntp_signd, kcc, dnsupdate

[sysvol]
    path = /var/lib/samba/sysvol
    read only = no

[netlogon]
    path = /var/lib/samba/sysvol/example.lan/scripts
    read only = no
