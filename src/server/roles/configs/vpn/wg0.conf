# Aether Server: WireGuard interface template.
#
# EVERY private key below is a placeholder. Generate real keys on the server
# and each peer, replace them, then enable:
#
#   umask 077
#   wg genkey | tee server.key | wg pubkey > server.pub
#   systemctl enable --now wg-quick@wg0
#
# Mode must stay 0600: the file holds private key material.

[Interface]
# Replace with the real server private key (wg genkey).
PrivateKey = REPLACE_WITH_SERVER_PRIVATE_KEY
Address = 10.9.0.1/24
ListenPort = 51820
# Route outbound tunnel traffic through the server's default interface.
PostUp = nft add rule inet aether_filter input udp dport 51820 counter accept
PostDown = nft delete rule inet aether_filter input udp dport 51820 counter accept 2>/dev/null || true

# One [Peer] block per client. Each needs its own key pair and address.
[Peer]
# Replace with the client's public key (wg pubkey of the client private key).
PublicKey = REPLACE_WITH_CLIENT_PUBLIC_KEY
AllowedIPs = 10.9.0.2/32
